databases:
  - name: kspdb-db
    databaseName: kspdb
    user: kspdb
    plan: free

services:
  - type: web
    name: kspdb-backend
    plan: free
    runtime: docker
    dockerfilePath: ./services/backend/Dockerfile
    dockerContext: ./services/backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kspdb-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
    healthCheckPath: /health

  - type: web
    name: kspdb-frontend
    runtime: static
    buildCommand: cd services/frontend && npm ci && npm run build
    staticPublishPath: services/frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
